[tool.poetry]
name = "nitro-plus-plus"
version = "0.1.0"
description = "Minimal JP→EN translator CLI that loads a Hugging Face model into CUDA"
authors = ["You"]
readme = "README.md"
packages = [{ include = "nitro_plus_plus", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.12"
transformers = "^4.44.0"
accelerate = "^0.33.0"
tokenizers = "^0.19.0"
safetensors = "^0.4.0"
sentencepiece = "^0.2.0"
huggingface-hub = "^0.25.0"
fastapi = "^0.115.0"
uvicorn = "^0.30.0"

[tool.poetry.group.cuda.dependencies]
# Match versions that pair with torch 2.8
torch = {version = "==2.8.*", source = "pytorch-cu128"}

# torch is version/OS/CUDA specific → install separately after `poetry install`
bitsandbytes = { version = "^0.43.0", markers = "platform_system == 'Linux' and platform_machine == 'x86_64'", optional = true }

[tool.poetry.extras]
gpu4bit = ["bitsandbytes"]

[tool.poetry.scripts]
nitropp = "nitro_plus_plus.cli:main"
killport = "nitro_plus_plus.cli:kill_port_main"


[[tool.poetry.source]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
priority = "explicit"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

